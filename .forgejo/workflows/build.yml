name: Build Frontend Image

on:
  push:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: podman

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Podman
        run: |
          podman --version

      - name: Check Containerfile
        run: |
          ls -la
          test -f Containerfile

      - name: Login to Forgejo Registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" | \
            podman login git.lewinxander.com \
            --username "${{ secrets.REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Build image
        run: |
          SHORT_SHA=$(echo "${{ forgejo.sha }}" | cut -c1-7)

          podman build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL }}" \
            -f Containerfile \
            -t git.lewinxander.com/lewin/ppklj-frontend:dev \
            -t git.lewinxander.com/lewin/ppklj-frontend:$SHORT_SHA \
            .

      - name: Push image
        run: |
          SHORT_SHA=$(echo "${{ forgejo.sha }}" | cut -c1-7)

          podman push \
            git.lewinxander.com/lewin/ppklj-frontend:dev

          podman push \
            git.lewinxander.com/lewin/ppklj-frontend:$SHORT_SHA
